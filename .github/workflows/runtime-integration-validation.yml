name: Runtime integration validation

on:
  push:
    paths:
      - "engine/**"
      - "app/integration/**"
      - "tests/integration/**"
      - "tests/patcher/**"
      - "validation/**"
      - "scripts/test_runtime_integration.sh"
      - "scripts/materialize_amod_box64_baseline.sh"
      - "scripts/patch_amod_box64_baseline.py"
      - "scripts/validate_box64_baseline_asset.sh"
      - "scripts/validate_rootfs_box64_loader_pair.sh"
      - "scripts/inspect_wine_loader_layout.sh"
      - "scripts/validate_minimal_container_pattern.sh"
      - "scripts/apply_upstream_patches.py"
      - "scripts/instrument_process_helper.py"
      - "scripts/instrument_session_gate.py"
      - "scripts/patch_session_gate_live_snapshot.py"
      - "scripts/instrument_guest_preflight.py"
      - "scripts/patch_guest_launcher_bootstrap.py"
      - "scripts/prepare_upstream_tree.sh"
      - ".github/workflows/runtime-integration-validation.yml"
  pull_request:
    paths:
      - "engine/**"
      - "app/integration/**"
      - "tests/integration/**"
      - "tests/patcher/**"
      - "validation/**"
      - "scripts/test_runtime_integration.sh"
      - "scripts/materialize_amod_box64_baseline.sh"
      - "scripts/patch_amod_box64_baseline.py"
      - "scripts/validate_box64_baseline_asset.sh"
      - "scripts/validate_rootfs_box64_loader_pair.sh"
      - "scripts/inspect_wine_loader_layout.sh"
      - "scripts/validate_minimal_container_pattern.sh"
      - "scripts/apply_upstream_patches.py"
      - "scripts/instrument_process_helper.py"
      - "scripts/instrument_session_gate.py"
      - "scripts/patch_session_gate_live_snapshot.py"
      - "scripts/instrument_guest_preflight.py"
      - "scripts/patch_guest_launcher_bootstrap.py"
      - "scripts/prepare_upstream_tree.sh"
      - ".github/workflows/runtime-integration-validation.yml"

jobs:
  runtime-plan-transaction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile and run runtime integration self-tests
        run: sh scripts/test_runtime_integration.sh

      - name: Validate upstream patcher
        run: python3 tests/patcher/test_apply_upstream_patches.py

      - name: Validate AMOD Box64 baseline patch
        run: python3 tests/patcher/test_amod_box64_baseline.py

      - name: Validate ProcessHelper diagnostic instrumentation
        run: python3 tests/patcher/test_instrument_process_helper.py

      - name: Validate guest launcher bootstrap patch
        run: python3 tests/patcher/test_guest_launcher_bootstrap.py

  patched-android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: third_party/winlator-app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Install runtime archive validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd binutils

      - name: Materialize fixed validation signing key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/winlator-buildtest-signing"
          base64 -d validation/buildtest-debug.keystore.b64 > "$RUNNER_TEMP/winlator-buildtest-signing/buildtest.keystore"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/winlator-buildtest-signing/buildtest.keystore" \
            -storepass android -alias buildtest | grep -E 'SHA256:|Alias name:'

      - name: Materialize pinned AMOD Box64 0.4.1
        run: sh scripts/materialize_amod_box64_baseline.sh

      - name: Validate RootFS and Box64 ARM64 loader pair
        run: sh scripts/validate_rootfs_box64_loader_pair.sh

      - name: Validate AMOD Box64 package
        run: sh scripts/validate_box64_baseline_asset.sh

      - name: Inspect packaged Wine loader layout
        run: sh scripts/inspect_wine_loader_layout.sh

      - name: Validate minimal container pattern prerequisites
        run: sh scripts/validate_minimal_container_pattern.sh

      - name: Prepare Winlator Build overlay
        run: sh scripts/prepare_upstream_tree.sh

      - name: Configure deterministic validation signing and version
        shell: bash
        env:
          WINLATOR_BUILDTEST_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/winlator-app/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'versionCode 32',
              'versionCode Integer.parseInt(System.getenv("WINLATOR_BUILDTEST_VERSION_CODE") ?: "100000")',
              1,
          )
          text = text.replace(
              '    buildTypes {\n        debug {',
              '''    signingConfigs {
                  buildtest {
                      storeFile file(System.getenv("WINLATOR_BUILDTEST_KEYSTORE"))
                      storePassword 'android'
                      keyAlias 'buildtest'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.buildtest''',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Assemble patched debug APK
        working-directory: third_party/winlator-app
        env:
          WINLATOR_BUILDTEST_KEYSTORE: ${{ runner.temp }}/winlator-buildtest-signing/buildtest.keystore
          WINLATOR_BUILDTEST_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signing certificate
        shell: bash
        run: |
          APK=$(find third_party/winlator-app/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload Android validation APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-build-runtime-validation-debug
          path: third_party/winlator-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
