name: Metadata validation

on:
  push:
    paths:
      - "components/**/*.json"
      - "profiles/**/*.json"
      - "scripts/validate_metadata.py"
      - ".github/workflows/metadata-validation.yml"
  pull_request:
    paths:
      - "components/**/*.json"
      - "profiles/**/*.json"
      - "scripts/validate_metadata.py"
      - ".github/workflows/metadata-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate component and profile metadata
        run: python scripts/validate_metadata.py
