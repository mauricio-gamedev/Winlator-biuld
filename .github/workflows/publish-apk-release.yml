name: Publish APK release

on:
  push:
    tags:
      - "dev-*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: dev-0.1.0-test1 or v0.1.0)"
        required: true
        type: string
      release_name:
        description: "Optional release name"
        required: false
        type: string
      prerelease:
        description: "Publish as pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_NAME: ${{ inputs.release_name }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
            NAME="$DISPATCH_NAME"
            PRE="$DISPATCH_PRERELEASE"
          else
            TAG="${GITHUB_REF_NAME}"
            NAME=""
            if [[ "$TAG" == dev-* ]]; then PRE=true; else PRE=false; fi
          fi

          if [[ -z "$NAME" ]]; then NAME="Winlator Build $TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Checkout with pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: third_party/winlator-app/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Install runtime archive validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd binutils

      - name: Materialize validation signing key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/winlator-buildtest-signing"
          base64 -d validation/buildtest-debug.keystore.b64 > "$RUNNER_TEMP/winlator-buildtest-signing/buildtest.keystore"

      - name: Materialize pinned AMOD Box64 primary and fallback
        run: |
          sh scripts/materialize_amod_box64_baseline.sh
          sh scripts/materialize_amod_box64_fallback.sh

      - name: Run full integration, loader, and patcher gates
        shell: bash
        run: |
          sh scripts/test_runtime_integration.sh
          python3 tests/patcher/test_apply_upstream_patches.py
          python3 tests/patcher/test_amod_box64_baseline.py
          python3 tests/patcher/test_box64_bootstrap_fallback.py
          python3 tests/patcher/test_instrument_process_helper.py
          python3 tests/patcher/test_guest_launcher_bootstrap.py
          sh scripts/validate_rootfs_box64_loader_pair.sh
          sh scripts/validate_box64_baseline_asset.sh
          sh scripts/inspect_wine_loader_layout.sh
          sh scripts/validate_minimal_container_pattern.sh

      - name: Prepare Winlator Build overlay
        run: sh scripts/prepare_upstream_tree.sh

      - name: Configure deterministic release-test signing and version
        shell: bash
        env:
          WINLATOR_BUILDTEST_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/winlator-app/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'versionCode 32',
              'versionCode Integer.parseInt(System.getenv("WINLATOR_BUILDTEST_VERSION_CODE") ?: "100000")',
              1,
          )
          text = text.replace(
              '    buildTypes {\n        debug {',
              '''    signingConfigs {
                  buildtest {
                      storeFile file(System.getenv("WINLATOR_BUILDTEST_KEYSTORE"))
                      storePassword 'android'
                      keyAlias 'buildtest'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.buildtest''',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Assemble APK
        working-directory: third_party/winlator-app
        env:
          WINLATOR_BUILDTEST_KEYSTORE: ${{ runner.temp }}/winlator-buildtest-signing/buildtest.keystore
          WINLATOR_BUILDTEST_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and stage APK
        id: apk
        shell: bash
        run: |
          SOURCE_APK=$(find third_party/winlator-app/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [[ -z "$SOURCE_APK" ]]; then
            echo "APK not found" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SOURCE_APK"
          mkdir -p release
          OUT="release/Winlator-Build-${{ steps.meta.outputs.tag }}-debug.apk"
          cp "$SOURCE_APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          PRE: ${{ steps.meta.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          NOTES=$(cat <<EOF
          ## Winlator Build development APK

          **Commit:** $GITHUB_SHA
          **Workflow run:** $GITHUB_RUN_ID

          This APK is produced by the repository's deterministic Android validation pipeline.

          ### Status
          - Core 0.1 runtime development
          - AMOD winlator-glibc Box64 0.4.1 primary baseline
          - Bounded one-shot AMOD Box64 0.3.8 fallback for early non-zero bootstrap exits
          - RootFS ARM64 loader/libc and both Box64 ELF pairs validated before build
          - ARM64 loader library path isolated from x86_64 Wine library path
          - FONTCONFIG and Android SysV SHM runtime support aligned with AMOD when present
          - Experimental build; not a stable release unless explicitly marked otherwise
          - See README.md and NOTICE.md for project status, ownership, attribution, and third-party licensing notes

          ### Integrity
          A SHA-256 checksum is attached alongside the APK.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' "$NOTES" | gh release edit "$TAG" --title "$NAME" --notes-file -
          else
            ARGS=(release create "$TAG" --title "$NAME" --notes-file - --target "$GITHUB_SHA")
            if [[ "$PRE" == "true" ]]; then ARGS+=(--prerelease); fi
            printf '%s\n' "$NOTES" | gh "${ARGS[@]}"
          fi

          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
